# Builds the package for each Umbraco major on every push to main and develop and on every pull request, and publishes
# the major a version tag names to NuGet when the tag is pushed: v17.2.0 on main, or a pre-release such as
# v17.3.0-beta.1 on a release branch. Publishing uses NuGet Trusted Publishing: GitHub's OIDC token is exchanged for a
# short-lived API key, so no NuGet API key is stored in the repository.
#
# The NuGet trusted publishing policy must name this file (build.yml) and the "production" environment, and that
# environment must only allow v* tags to deploy. Actions are pinned to commit SHAs; Dependabot keeps them current.
name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: src/Umbricians.LiveView/Umbricians.LiveView.csproj
  CLIENT_DIR: src/Umbricians.LiveView/Client
  DEMO_DIR: demo/Umbricians.LiveView.Demo
  BUNDLE_PATH: /App_Plugins/UmbriciansLiveView/umbricians-live-view.js
  API_NAME: umbricians-live-view
  API_TITLE: Umbricians Live View
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Live View is built once per Umbraco major, each its own package (17.x for Umbraco 17, 18.x for 18, 19.x for 19).
  # A tag builds the one major it names; everything else builds them all. The majors are the ones
  # Directory.Build.props knows, so a new major goes in both places.
  plan:
    runs-on: ubuntu-latest
    outputs:
      majors: ${{ steps.majors.outputs.majors }}
    steps:
      - id: majors
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            major="${GITHUB_REF_NAME#v}"
            echo "majors=[\"${major%%.*}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'majors=["17", "18", "19"]' >> "$GITHUB_OUTPUT"
          fi

  build-umbraco:
    name: build (Umbraco ${{ matrix.umbraco }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco: ${{ fromJSON(needs.plan.outputs.majors) }}
    env:
      UMBRACO_MAJOR: ${{ matrix.umbraco }}
    steps:
      # Full history, so the version step can find the last release tag and tag builds can check they're on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      # The SDK in global.json builds every major; Umbraco 17 and 18 run on .NET 10, so the tests need its runtime.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # Gitflow tags releases on main and pre-releases (v17.3.0-beta.1) on a release branch, so a tag anywhere else is
      # a mistake that must not publish.
      - name: Check the tag is on main or a release branch
        if: github.ref_type == 'tag'
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            if [[ -z "$(git branch --remotes --contains HEAD --list 'origin/release/*')" ]]; then
              echo "::error::$GITHUB_REF_NAME is not on a release branch. Tag a commit on release/x.y.z."
              exit 1
            fi
          elif ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag the merge commit of the release or hotfix PR."
            exit 1
          fi

      # The build scripts decide the published version and the README nuget.org shows, so their tests run before either is used.
      - name: Test build scripts
        run: node --test "build/*.test.mjs"

      # Directory.Build.props maps the major to the project's <Version>, its target framework and the lowest Umbraco
      # version it supports. A tag must be the next release of its major, and the pack checks the public API against
      # the major's last version on nuget.org.
      - name: Work out version
        id: version
        run: |
          properties=$(dotnet msbuild "$PROJECT" -getProperty:PackageId -getProperty:Version -getProperty:TargetFramework -getProperty:UmbracoVersion -p:UmbracoMajor="$UMBRACO_MAJOR")
          package=$(jq -r .Properties.PackageId <<< "$properties")
          project=$(jq -r .Properties.Version <<< "$properties")
          umbraco=$(jq -r .Properties.UmbracoVersion <<< "$properties")
          version=$(node build/package-version.mjs "$package" "$project" "$umbraco")
          baseline=$(node build/package-version.mjs "$package" "$project" "$umbraco" --baseline)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "framework=$(jq -r .Properties.TargetFramework <<< "$properties")" >> "$GITHUB_OUTPUT"
          echo "umbraco=$umbraco" >> "$GITHUB_OUTPUT"
          echo "Version: $version, checked against ${baseline:-the baseline in Directory.Build.props}"

      - name: Stamp version into umbraco-package.json
        run: node build/stamp-version.mjs "$CLIENT_DIR/public/umbraco-package.json" "${{ steps.version.outputs.version }}"

      # The client checks its types against the backoffice of the lowest Umbraco version of this major.
      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm install --no-save "@umbraco-cms/backoffice@${{ steps.version.outputs.umbraco }}"
          npm test
          npm run build

      # Builds the demo site too, so changes that break integration fail here.
      - name: Build solution
        run: dotnet build Umbricians.LiveView.slnx -c Release -p:UmbracoMajor="$UMBRACO_MAJOR" -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Umbricians.LiveView.slnx -c Release --no-build -p:UmbracoMajor="$UMBRACO_MAJOR"

      # Umbraco 17 serves API documents through Swashbuckle; Umbraco 18 moved them to ASP.NET Core's OpenAPI.
      - name: Smoke-test the demo
        run: |
          if [[ "$UMBRACO_MAJOR" == 17 ]]; then document="/umbraco/swagger/$API_NAME/swagger.json"; else document="/umbraco/openapi/$API_NAME.json"; fi
          node build/smoke-test.mjs "$DEMO_DIR" "${{ steps.version.outputs.framework }}" "$BUNDLE_PATH" "$document" "$API_TITLE"

      # Packs with a build, so the package always carries the static web assets of the bundle built above.
      - name: Pack
        run: dotnet pack "$PROJECT" -c Release -p:UmbracoMajor="$UMBRACO_MAJOR" -p:Version=${{ steps.version.outputs.version }} -p:LastReleaseVersion=${{ steps.version.outputs.baseline }} -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package-${{ matrix.umbraco }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # The branch rulesets require a "build" check, so this one passes only when every major built.
  build:
    if: always()
    needs: build-umbraco
    runs-on: ubuntu-latest
    steps:
      - name: Check every Umbraco major built
        run: |
          if [[ "${{ needs.build-umbraco.result }}" != success ]]; then
            echo "::error::An Umbraco major failed to build (${{ needs.build-umbraco.result }})."
            exit 1
          fi

  publish:
    # Only a pushed version tag publishes; branches, pull requests and manual runs stop after the build.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment in the NuGet trusted publishing policy. The environment needs required reviewers
    # and a deployment rule allowing only v* tags (see docs/RELEASING.md).
    environment: production
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token that NuGet trusts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuget-package-*
          merge-multiple: true
          path: artifacts

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Exchanges the OIDC token for a NuGet API key that lasts one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .snupkg beside each .nupkg too.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    # Runs only once the package is on NuGet, so every GitHub release has a matching package.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuget-package-*
          merge-multiple: true
          path: artifacts

      # build/release-options.mjs picks the options: a pre-release for a suffixed tag, notes from the last release of
      # the same Umbraco major, and Latest only for the newest major. Re-running leaves an existing release alone.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          # Each command is an assignment of its own, so a failed `gh release list` or script stops the step: the
          # default shell runs bash with -e but not pipefail, so a failure inside a pipeline wouldn't.
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 100 --json tagName)
          chosen=$(node build/release-options.mjs "$TAG" <<< "$releases")
          mapfile -t options <<< "$chosen"
          echo "Options: ${options[*]}"
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag "${options[@]}"
