# Builds the package on every push to main and develop and on every pull request, and publishes it to NuGet when a
# version tag is pushed: v1.2.0 on main, or a pre-release such as v1.3.0-beta.1 on a release branch. Publishing uses
# NuGet Trusted Publishing: GitHub's OIDC token is exchanged for a short-lived API key, so no NuGet API key is stored
# in the repository.
#
# The NuGet trusted publishing policy must name this file (build.yml) and the "production" environment, and that
# environment must only allow v* tags to deploy. Actions are pinned to commit SHAs; Dependabot keeps them current.
name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: src/Umbricians.LiveView/Umbricians.LiveView.csproj
  CLIENT_DIR: src/Umbricians.LiveView/Client
  DEMO_DIR: demo/Umbricians.LiveView.Demo
  BUNDLE_PATH: /App_Plugins/UmbriciansLiveView/umbricians-live-view.js
  API_NAME: umbricians-live-view
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history, so the version step can find the last release tag and tag builds can check they're on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Gitflow tags releases on main and pre-releases (v1.3.0-beta.1) on a release branch, so a tag anywhere else is
      # a mistake that must not publish.
      - name: Check the tag is on main or a release branch
        if: github.ref_type == 'tag'
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            if [[ -z "$(git branch --remotes --contains HEAD --list 'origin/release/*')" ]]; then
              echo "::error::$GITHUB_REF_NAME is not on a release branch. Tag a commit on release/x.y.z."
              exit 1
            fi
          elif ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag the merge commit of the release or hotfix PR."
            exit 1
          fi

      - name: Work out version
        id: version
        run: |
          version=$(node build/package-version.mjs "$PROJECT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Stamp version into umbraco-package.json
        run: node build/stamp-version.mjs "$CLIENT_DIR/public/umbraco-package.json" "${{ steps.version.outputs.version }}"

      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci
          npm test
          npm run build

      # Builds the demo site too, so changes that break integration fail here.
      - name: Build solution
        run: dotnet build Umbricians.LiveView.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Umbricians.LiveView.slnx -c Release --no-build

      - name: Smoke-test the demo
        run: node build/smoke-test.mjs "$DEMO_DIR" "$BUNDLE_PATH" "$API_NAME"

      # Packs with a build, so the package always carries the static web assets of the bundle built above.
      - name: Pack
        run: dotnet pack "$PROJECT" -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    # Only a pushed version tag publishes; branches, pull requests and manual runs stop after the build.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment in the NuGet trusted publishing policy. The environment needs required reviewers
    # and a deployment rule allowing only v* tags (see docs/RELEASING.md).
    environment: production
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token that NuGet trusts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Exchanges the OIDC token for a NuGet API key that lasts one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .snupkg beside each .nupkg too.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    # Runs only once the package is on NuGet, so every GitHub release has a matching package.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: artifacts

      # Tags with a pre-release suffix (v1.3.0-beta.1) become GitHub pre-releases. Notes start at the last stable
      # release, so a release after betas lists everything since then. Re-running leaves an existing release alone.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          options=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag)
          [[ "$TAG" == *-* ]] && options+=(--prerelease)
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          [[ -n "$previous" ]] && options+=(--notes-start-tag "$previous")
          gh release create "$TAG" artifacts/* "${options[@]}"
