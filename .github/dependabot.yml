# Version updates open pull requests against the default branch, develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      umbraco:
        patterns: ["Umbraco.*"]
    # The package's references in src/Directory.Packages.props stay at the lowest Umbraco version it supports. The
    # demo's Umbraco.Cms keeps getting updates.
    ignore:
      - dependency-name: "Umbraco.Cms.Api.Common"
      - dependency-name: "Umbraco.Cms.Api.Management"
      - dependency-name: "Umbraco.Cms.Web.Common"

  - package-ecosystem: npm
    directory: /src/Umbricians.LiveView/Client
    schedule:
      interval: weekly
    # @umbraco-cms/backoffice stays at the lowest Umbraco version the package supports.
    ignore:
      - dependency-name: "@umbraco-cms/backoffice"
