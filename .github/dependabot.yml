# Version updates open pull requests against the default branch, develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      umbraco:
        patterns: ["Umbraco.*"]
    ignore:
      # The package's references in src/Directory.Packages.props stay at the lowest Umbraco version it supports.
      - dependency-name: "Umbraco.Cms.Api.Common"
      - dependency-name: "Umbraco.Cms.Api.Management"
      - dependency-name: "Umbraco.Cms.Web.Common"
      # The demo's Umbraco.Cms keeps getting minor and patch updates. A new Umbraco major moves the package, the
      # client and the demo together in a major release (the Umbricians package conventions, Versions), so it isn't
      # proposed here.
      - dependency-name: "Umbraco.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/Umbricians.LiveView/Client
    schedule:
      interval: weekly
    ignore:
      # @umbraco-cms/backoffice stays at the lowest Umbraco version the package supports.
      - dependency-name: "@umbraco-cms/backoffice"
      # The types follow the Node major CI runs (node-version in build.yml), so they only offer APIs it has.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
