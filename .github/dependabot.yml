# Version updates open pull requests against the default branch, develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      umbraco:
        patterns: ["Umbraco.*"]
    ignore:
      # The package's references stay at the lowest Umbraco version each major supports (UmbracoVersion in
      # Directory.Build.props).
      - dependency-name: "Umbraco.Cms.Api.Common"
      - dependency-name: "Umbraco.Cms.Api.Management"
      - dependency-name: "Umbraco.Cms.Web.Common"
      # The demo's Umbraco.Cms (UmbracoDemoVersion in Directory.Build.props) keeps getting minor and patch updates.
      # Supporting a new Umbraco major means adding it to Directory.Build.props and build.yml, so it isn't proposed
      # here.
      - dependency-name: "Umbraco.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/Umbricians.LiveView/Client
    schedule:
      interval: weekly
    ignore:
      # @umbraco-cms/backoffice stays at the lowest Umbraco 17 version the package supports; CI swaps in each major's
      # own (build.yml).
      - dependency-name: "@umbraco-cms/backoffice"
      # The types follow the Node major CI runs (node-version in build.yml), so they only offer APIs it has.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
